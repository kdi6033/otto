<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gMe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gAws" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gOtto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="aSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="aOrangeStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="920" height="440" rx="20" fill="url(#bg)"/>

  <!-- 상단 제목 -->
  <text x="460" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">아마존(AWS) 클라우드 서버로 인터넷 어디서나 Otto 조종하기</text>
  <text x="460" y="66" text-anchor="middle" font-size="14" fill="#64748b">집 밖에서도 휴대폰·PC 브라우저로 AWS 서버에 접속해 로봇을 움직여요</text>

  <!-- 1. 휴대폰·PC 브라우저 카드 -->
  <g filter="url(#sh)">
    <rect x="24" y="96" width="190" height="310" rx="20" fill="#ffffff"/>
    <rect x="24" y="96" width="190" height="52" rx="20" fill="url(#gMe)"/>
    <rect x="24" y="128" width="190" height="20" fill="url(#gMe)"/>
  </g>
  <text x="119" y="129" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">휴대폰 · PC 브라우저</text>

  <rect x="40" y="168" width="158" height="218" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <!-- 원형 조종판 미니 아이콘 -->
  <circle cx="119" cy="222" r="34" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="119" cy="222" r="11" fill="#2563eb"/>
  <path d="M119 194 L114 202 L124 202 Z" fill="#1d4ed8"/>
  <path d="M119 250 L114 242 L124 242 Z" fill="#1d4ed8"/>
  <path d="M91 222 L99 217 L99 227 Z" fill="#1d4ed8"/>
  <path d="M147 222 L139 217 L139 227 Z" fill="#1d4ed8"/>

  <text x="119" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">조종 화면</text>
  <text x="119" y="308" text-anchor="middle" font-size="13" fill="#475569">(4장과 같은</text>
  <text x="119" y="327" text-anchor="middle" font-size="13" fill="#475569">원형 조종판)</text>
  <rect x="52" y="344" width="134" height="26" rx="8" fill="#dbeafe"/>
  <text x="119" y="361" text-anchor="middle" font-size="12" font-family="Consolas,monospace" font-weight="700" fill="#1e40af">http://서버주소</text>

  <!-- 2. AWS 서버 (고정 IP) 카드 -->
  <g filter="url(#sh)">
    <rect x="294" y="96" width="352" height="310" rx="20" fill="#ffffff"/>
    <rect x="294" y="96" width="352" height="52" rx="20" fill="url(#gAws)"/>
    <rect x="294" y="128" width="352" height="20" fill="url(#gAws)"/>
  </g>
  <text x="470" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">☁️ AWS 서버 (고정 IP)</text>

  <!-- ① 웹 화면 (React) -->
  <rect x="314" y="166" width="185" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="406" y="193" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">① 웹 화면 (React)</text>
  <text x="406" y="215" text-anchor="middle" font-size="12.5" fill="#475569">브라우저에 조종 화면 전송</text>

  <!-- ② 중계 서버 (Node) -->
  <rect x="314" y="246" width="185" height="66" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="406" y="273" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">② 중계 서버 (Node)</text>
  <text x="406" y="295" text-anchor="middle" font-size="12.5" fill="#475569">명령 전달 · 상태 반환</text>

  <!-- ④ MongoDB -->
  <rect x="314" y="326" width="185" height="64" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="406" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">④ MongoDB</text>
  <text x="406" y="373" text-anchor="middle" font-size="12.5" fill="#475569">로봇 목록 · 기록 저장</text>

  <!-- ③ Mosquitto (MQTT 브로커) -->
  <rect x="528" y="196" width="102" height="166" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="579" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">③ Mosquitto</text>
  <text x="579" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ea580c">(MQTT 브로커)</text>
  <text x="579" y="302" text-anchor="middle" font-size="12" fill="#64748b">메시지 우체국</text>

  <!-- ② -> ③ 내부 화살표 -->
  <line x1="499" y1="279" x2="524" y2="279" stroke="#059669" stroke-width="3" marker-end="url(#aGreen)"/>

  <!-- 3. Otto 로봇 카드 -->
  <g filter="url(#sh)">
    <rect x="726" y="96" width="170" height="310" rx="20" fill="#ffffff"/>
    <rect x="726" y="96" width="170" height="52" rx="20" fill="url(#gOtto)"/>
    <rect x="726" y="128" width="170" height="20" fill="url(#gOtto)"/>
  </g>
  <text x="811" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Otto 로봇</text>

  <rect x="742" y="168" width="138" height="218" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <!-- 귀여운 Otto 로봇 얼굴 아이콘 -->
  <rect x="773" y="190" width="76" height="54" rx="12" fill="#0f172a"/>
  <circle cx="795" cy="217" r="10" fill="#38bdf8"/>
  <circle cx="827" cy="217" r="10" fill="#38bdf8"/>
  <circle cx="798" cy="214" r="3" fill="#ffffff"/>
  <circle cx="830" cy="214" r="3" fill="#ffffff"/>

  <text x="811" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">로봇 (ESP32-S3)</text>
  <text x="811" y="302" text-anchor="middle" font-size="13" fill="#475569">서버에 접속해</text>
  <text x="811" y="321" text-anchor="middle" font-size="13" fill="#475569">명령을 기다리고</text>
  <text x="811" y="340" text-anchor="middle" font-size="13" fill="#475569">동작해요</text>

  <!-- 브라우저 <-> AWS 서버 화살표 (HTTP 80) -->
  <rect x="218" y="182" width="72" height="26" rx="13" fill="#dbeafe"/>
  <text x="254" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">HTTP 80</text>

  <!-- 명령 (브라우저 -> 서버) -->
  <line x1="214" y1="232" x2="290" y2="232" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aBlue)"/>
  <text x="254" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">조종 명령</text>

  <!-- 화면·상태 (서버 -> 브라우저) -->
  <line x1="290" y1="286" x2="214" y2="286" stroke="#475569" stroke-width="3.5" stroke-linecap="round" marker-end="url(#aSlate)"/>
  <text x="254" y="305" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">화면 · 상태</text>

  <!-- Mosquitto <-> Otto 로봇 화살표 (MQTT 1883) -->
  <rect x="646" y="218" width="80" height="26" rx="13" fill="#ffedd5"/>
  <text x="686" y="235" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">MQTT 1883</text>

  <line x1="636" y1="279" x2="720" y2="279" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" marker-start="url(#aOrangeStart)" marker-end="url(#aOrange)"/>
  <text x="686" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">양방향 통신</text>
</svg>

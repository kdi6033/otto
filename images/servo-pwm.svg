<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">180도 서보모터: 펄스가 켜져 있는 시간(펄스폭)이 각도를 정한다</text>
<text x="20" y="92" font-size="17" font-weight="bold" fill="#1565c0">0도</text>
<text x="20" y="112" font-size="13" fill="#555">0.5ms</text>
<polyline fill="none" stroke="#1565c0" stroke-width="3" points="70,110 100,110 100,76 110.0,76 110.0,110 500,110 500,76 510.0,76 510.0,110 880,110"/>
<text x="20" y="162" font-size="17" font-weight="bold" fill="#00838f">45도</text>
<text x="20" y="182" font-size="13" fill="#555">1.0ms</text>
<polyline fill="none" stroke="#00838f" stroke-width="3" points="70,180 100,180 100,146 120.0,146 120.0,180 500,180 500,146 520.0,146 520.0,180 880,180"/>
<text x="20" y="232" font-size="17" font-weight="bold" fill="#2e7d32">90도</text>
<text x="20" y="252" font-size="13" fill="#555">1.5ms</text>
<polyline fill="none" stroke="#2e7d32" stroke-width="3" points="70,250 100,250 100,216 130.0,216 130.0,250 500,250 500,216 530.0,216 530.0,250 880,250"/>
<text x="20" y="302" font-size="17" font-weight="bold" fill="#ef6c00">135도</text>
<text x="20" y="322" font-size="13" fill="#555">2.0ms</text>
<polyline fill="none" stroke="#ef6c00" stroke-width="3" points="70,320 100,320 100,286 140.0,286 140.0,320 500,320 500,286 540.0,286 540.0,320 880,320"/>
<text x="20" y="372" font-size="17" font-weight="bold" fill="#c62828">180도</text>
<text x="20" y="392" font-size="13" fill="#555">2.5ms</text>
<polyline fill="none" stroke="#c62828" stroke-width="3" points="70,390 100,390 100,356 150.0,356 150.0,390 500,390 500,356 550.0,356 550.0,390 880,390"/>
<line x1="100" y1="410" x2="500" y2="410" stroke="#444" stroke-width="2"/>
<line x1="100" y1="402" x2="100" y2="418" stroke="#444" stroke-width="2"/>
<line x1="500" y1="402" x2="500" y2="418" stroke="#444" stroke-width="2"/>
<text x="300" y="438" text-anchor="middle" font-size="15" fill="#222">한 주기 = 20ms (1초에 50번)</text>
<text x="640" y="210" font-size="15" fill="#444">펄스가 길수록</text>
<text x="640" y="232" font-size="15" fill="#444">서보가 더 많이 돌아간다</text>
</svg>